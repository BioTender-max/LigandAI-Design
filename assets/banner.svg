<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="160" rx="12" fill="url(#bg)"/>

  <!-- subtle grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="400" y1="0" x2="400" y2="160"/>
    <line x1="600" y1="0" x2="600" y2="160"/>
  </g>

  <!-- molecule decoration (right side) -->
  <!-- nodes -->
  <circle cx="660" cy="50"  r="7" fill="none" stroke="#2ea043" stroke-width="1.8"/>
  <circle cx="700" cy="80"  r="7" fill="none" stroke="#3fb950" stroke-width="1.8"/>
  <circle cx="660" cy="110" r="7" fill="none" stroke="#2ea043" stroke-width="1.8"/>
  <circle cx="620" cy="80"  r="7" fill="none" stroke="#3fb950" stroke-width="1.8"/>
  <circle cx="740" cy="50"  r="5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="740" cy="110" r="5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="580" cy="50"  r="5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="580" cy="110" r="5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <!-- bonds -->
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="660" y1="50"  x2="700" y2="80"/>
    <line x1="700" y1="80"  x2="660" y2="110"/>
    <line x1="660" y1="110" x2="620" y2="80"/>
    <line x1="620" y1="80"  x2="660" y2="50"/>
    <line x1="700" y1="80"  x2="740" y2="50"/>
    <line x1="700" y1="80"  x2="740" y2="110"/>
    <line x1="620" y1="80"  x2="580" y2="50"/>
    <line x1="620" y1="80"  x2="580" y2="110"/>
  </g>

  <!-- green accent bar -->
  <rect x="40" y="44" width="4" height="72" rx="2" fill="url(#accent)"/>

  <!-- main title -->
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="32" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">
    LigandAI<tspan fill="#3fb950">-Design</tspan>
  </text>

  <!-- subtitle -->
  <text x="61" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="13.5" fill="#8b949e" letter-spacing="0.2">
    End-to-End Protein &amp; Peptide Binder Design · Powered by LigandAI
  </text>

  <!-- version pill -->
  <rect x="61" y="122" width="110" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="116" y="136" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="11" fill="#3fb950" text-anchor="middle">ligandai v0.5.3</text>

  <!-- skills pill -->
  <rect x="181" y="122" width="72" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="217" y="136" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="11" fill="#8b949e" text-anchor="middle">5 Skills</text>

  <!-- Apache pill -->
  <rect x="263" y="122" width="80" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="303" y="136" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        font-size="11" fill="#8b949e" text-anchor="middle">Apache 2.0</text>
</svg>